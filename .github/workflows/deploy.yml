name: Deploy to GitHub Pages

# GitHub Pages serves one site per repo, so both environments ship together:
#   master  -> https://jenaestuder.com/           (production)
#   develop -> https://jenaestuder.com/staging/   (not-prod preview, noindex)
# Every run rebuilds both branches and deploys them as a single artifact.

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pull requests: prove lint, types and build are green. No deploy.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          path: prod

      - uses: actions/checkout@v6
        with:
          ref: develop
          path: staging

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            prod/package-lock.json
            staging/package-lock.json

      # TEMPORARY bridge: until master contains the Next.js app, keep serving the
      # existing 2019 site (gh-pages branch) at the root so the live site is
      # untouched while develop is previewed at /staging/. Once master is
      # merged this detects Next.js and the legacy steps never run.
      - name: Detect whether master has the Next.js app
        id: detect
        run: |
          if [ -f prod/next.config.ts ]; then echo "next=true" >> "$GITHUB_OUTPUT"; else echo "next=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v6
        if: steps.detect.outputs.next != 'true'
        with:
          ref: gh-pages
          path: legacy

      # Production must build, or nothing deploys.
      - name: Build production (master)
        if: steps.detect.outputs.next == 'true'
        working-directory: prod
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build

      # A broken develop must never block production, so this step may fail;
      # if it does, the site deploys without /staging/.
      - name: Build staging (develop)
        id: staging
        continue-on-error: true
        working-directory: staging
        env:
          BASE_PATH: /staging
          NEXT_PUBLIC_ENV: staging
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build

      - name: Assemble site
        run: |
          mkdir site
          if [ "${{ steps.detect.outputs.next }}" = "true" ]; then
            cp -R prod/out/. site/
          else
            echo "::notice::master is not on Next.js yet, serving the legacy gh-pages site at the root"
            rm -rf legacy/.git
            cp -R legacy/. site/
          fi
          if [ "${{ steps.staging.outcome }}" = "success" ]; then
            mkdir site/staging
            cp -R staging/out/. site/staging/
          else
            echo "::warning::develop failed to build, deploying production only"
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
